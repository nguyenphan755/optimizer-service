# CADIVI MES — Nginx phục vụ build Vite + proxy API (chỉnh root / cổng backend cho môi trường).
# Sao chép vào /etc/nginx/sites-available/ hoặc include từ cấu hình chính.
# Lưu ý: `limit_req_zone` phải nằm trong ngữ cảnh `http` của Nginx.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;

    # Đường dẫn tới thư mục sau `npm run build` (vite outDir mặc định: dist)
    root /var/www/cadivi-mes/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # Chặn file ẩn/thư mục nhạy cảm
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chỉ cho phép method web phổ biến
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Cookie refresh httpOnly cần đi qua proxy
        proxy_cookie_path /api /api;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
